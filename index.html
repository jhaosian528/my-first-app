<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>我的全端之路</title>
  <style>
    body {
      background: linear-gradient(135deg, yellow,blue);
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', '微軟正黑體', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: #fff;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      text-shadow: 0 2px 10px rgba(20,80,80,0.1);
      letter-spacing: 2px;
    }

    .pretty-button {
      background: linear-gradient(90deg, #fff6b7 0%, #f6416c 100%);
      color: #333;
      border: none;
      border-radius: 30px;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(246,65,108,0.12);
      transition: background 0.2s, transform 0.2s;
      outline: none;
    }

    .pretty-button:hover {
      background: linear-gradient(90deg, #fbc2eb 0%, #a6c1ee 100%);
      transform: translateY(-2px) scale(1.04);
    }
  </style>
</head>
<body>
  <h1 id="title">小明的全端之路</h1>
  <img src="https://stimg.cardekho.com/images/carexteriorimages/630x420/Mercedes-Benz/AMG-G-63/9737/16?t=w-664" alt="CAR">
  <button class="pretty-button" onclick="alert('Hello Future Coder!')">
    展開全端之路
  </button>
  <div style="margin-top: 20px;">
    <input type="text" id="commentInput" placeholder="想說點什麼嗎？">
    <button onclick="addComment()">發佈留言</button>
  </div>

  <ul id="commentList" style="margin-top: 20px;"></ul>

<script>
  // --- LocalStorage 相關功能 ---
  function saveCommentsToLocalStorage(comments) {
    localStorage.setItem('commentsList', JSON.stringify(comments));
  }

  function getCommentsFromLocalStorage() {
    const comments = localStorage.getItem('commentsList');
    return comments ? JSON.parse(comments) : [];
  }

  function addComment() {
    const input = document.getElementById('commentInput');
    const message = input.value;

    if (message === '') {
      alert('請先輸入文字喔！');
      return;
    }

    // 取得目前localStorage留言，加入新留言(新增留言都插在列表最後)
    const comments = getCommentsFromLocalStorage();
    comments.push(message);
    saveCommentsToLocalStorage(comments);

    renderComments();

    input.value = '';
  }

  // 渲染留言(依據localStorage資料)
  function renderComments() {
    const list = document.getElementById('commentList');
    list.innerHTML = ''; // 先清空舊留言

    const comments = getCommentsFromLocalStorage();

    // 沒有留言就給一條預設留言
    if (comments.length === 0) {
      const li = document.createElement('li');
      li.textContent = '這是一條預設留言';
      list.appendChild(li);

      // 補加刪除按鈕（預設留言也能刪除，且刪除會清空 localStorage）
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = '刪除';
      deleteBtn.style.marginLeft = '8px';
      deleteBtn.onclick = function() {
        localStorage.removeItem('commentsList');
        renderComments();
      };
      li.appendChild(deleteBtn);

    } else {
      // 根據 localStorage 渲染所有留言
      comments.forEach(function(comment, idx) {
        const li = document.createElement('li');
        li.textContent = comment + ' ';

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '刪除';
        deleteBtn.style.marginLeft = '8px';
        deleteBtn.onclick = function() {
          // 刪除本條留言
          const comments = getCommentsFromLocalStorage();
          comments.splice(idx, 1);
          saveCommentsToLocalStorage(comments);
          renderComments();
        };
        li.appendChild(deleteBtn);

        list.appendChild(li);
      });
    }
  }

  // 載入頁面時自動渲染 LocalStorage 的留言
  window.onload = function() {
    renderComments();
  };
</script>
</body>
</html>
